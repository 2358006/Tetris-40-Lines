<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport"
    content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>Unity Web Player | 40Lines</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #unity-canvas {
      display: block;
      background: #000000;
    }
  </style>
</head>

<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <script src="Build/Tetris-40-Lines.loader.js"></script>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const targetAspect = 1920 / 1080; // 16:9 비율

    function resizeCanvas() {
      // 스크롤바·작업표시줄·주소창을 제외한 순수 내부 뷰포트 크기 기준
      const availableWidth = document.documentElement.clientWidth;
      const availableHeight = document.documentElement.clientHeight;
      const availableAspect = availableWidth / availableHeight;

      let finalWidth, finalHeight;

      if (availableAspect > targetAspect) {
        // 창이 가로로 더 넓을 때: 세로(작업표시줄 위쪽까지)에 꽉 맞추고 가로 비율 계산
        finalHeight = availableHeight;
        finalWidth = Math.floor(availableHeight * targetAspect);
      } else {
        // 창이 세로로 더 길 때: 가로에 꽉 맞추고 세로 비율 계산
        finalWidth = availableWidth;
        finalHeight = Math.floor(availableWidth / targetAspect);
      }

      canvas.style.width = finalWidth + "px";
      canvas.style.height = finalHeight + "px";
    }

    // 창 크기 변경, 최대화/창모드 전환, 작업표시줄 높이 변화 모두 실시간 감지
    window.addEventListener("resize", resizeCanvas);
    if (window.ResizeObserver) {
      new ResizeObserver(resizeCanvas).observe(document.body);
    }
    resizeCanvas();

    createUnityInstance(canvas, {
      arguments: [],
      dataUrl: "Build/Tetris-40-Lines.data.unityweb",
      frameworkUrl: "Build/Tetris-40-Lines.framework.js.unityweb",
      codeUrl: "Build/Tetris-40-Lines.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Zigurous",
      productName: "40Lines",
      productVersion: "1.0",
      matchWebGLToCanvasSize: true // 캔버스 CSS 크기 변경 시 내부 렌더링 해상도도 함께 선명하게 동기화
    }).then((unityInstance) => {
      resizeCanvas(); // Unity 인스턴스 로드 직후 한 번 더 정확한 크기로 보정
    }).catch((message) => {
      alert(message);
    });
  </script>
</body>

</html>
