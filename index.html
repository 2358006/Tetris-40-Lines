<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport"
    content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>Unity Web Player | 40Lines</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #unity-canvas {
      display: block;
      background: #000000;
    }
  </style>
</head>

<body>
  <!-- 내부 렌더링 버퍼는 1920x1080 고정 -->
  <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>
  <script src="Build/Tetris-40-Lines.loader.js"></script>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const targetAspect = 1920 / 1080;

    function resizeCanvas() {
      const availableWidth = document.documentElement.clientWidth;
      const availableHeight = document.documentElement.clientHeight;
      const availableAspect = availableWidth / availableHeight;

      if (availableAspect > targetAspect) {
        canvas.style.height = availableHeight + "px";
        canvas.style.width = Math.floor(availableHeight * targetAspect) + "px";
      } else {
        canvas.style.width = availableWidth + "px";
        canvas.style.height = Math.floor(availableWidth / targetAspect) + "px";
      }
    }

    window.addEventListener("resize", resizeCanvas);
    if (window.ResizeObserver) {
      new ResizeObserver(resizeCanvas).observe(document.body);
    }
    resizeCanvas();

    createUnityInstance(canvas, {
      arguments: [],
      dataUrl: "Build/Tetris-40-Lines.data.unityweb",
      frameworkUrl: "Build/Tetris-40-Lines.framework.js.unityweb",
      codeUrl: "Build/Tetris-40-Lines.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Zigurous",
      productName: "40Lines",
      productVersion: "1.0",
      matchWebGLToCanvasSize: false // 핵심: 내부 해상도(1920x1080) 고정, 화면 출력만 비율 축소
    }).then((unityInstance) => {
      resizeCanvas();
    }).catch((message) => {
      alert(message);
    });
  </script>
</body>

</html>
