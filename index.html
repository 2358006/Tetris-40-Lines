<!DOCTYPE html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport"
    content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
  <title>Unity Web Player | 40Lines</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* 가로·세로 스크롤바 완전 제거 */
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #unity-canvas {
      display: block;
      background: #000000;
    }
  </style>
</head>

<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <script src="Build/Tetris-40-Lines.loader.js"></script>
  <script>
    const canvas = document.querySelector("#unity-canvas");
    const targetAspect = 1920 / 1080; // 16:9 비율 고정

    function resizeCanvas() {
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        canvas.style.width = "100vw";
        canvas.style.height = "100vh";
        return;
      }

      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;
      const windowAspect = windowWidth / windowHeight;

      if (windowAspect > targetAspect) {
        canvas.style.height = windowHeight + "px";
        canvas.style.width = Math.floor(windowHeight * targetAspect) + "px";
      } else {
        canvas.style.width = windowWidth + "px";
        canvas.style.height = Math.floor(windowWidth / targetAspect) + "px";
      }
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    createUnityInstance(canvas, {
      arguments: [],
      dataUrl: "Build/Tetris-40-Lines.data.unityweb",
      frameworkUrl: "Build/Tetris-40-Lines.framework.js.unityweb",
      codeUrl: "Build/Tetris-40-Lines.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Zigurous",
      productName: "40Lines",
      productVersion: "1.0",
    }).then((unityInstance) => {
    }).catch((message) => {
      alert(message);
    });
  </script>
</body>

</html>
